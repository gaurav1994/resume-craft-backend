version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "Installing Maven wrapper dependencies"
      - chmod +x ./mvnw

  pre_build:
    commands:
      - echo "Login to ECR"
      - aws --version
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export COMMIT_ID=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - export IMAGE_TAG=${COMMIT_ID:-latest}
      - export IMAGE_REPO=${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/resume-craft-backend
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Build started on `date`
      - echo "Building backend jar"
      - ./mvnw clean package -DskipTests

      - echo "Building backend docker image with commit tag ${IMAGE_TAG}"
      - docker build -t resume-craft-backend:${IMAGE_TAG} .
      - docker tag resume-craft-backend:${IMAGE_TAG} ${IMAGE_REPO}:${IMAGE_TAG}
      - docker push ${IMAGE_REPO}:${IMAGE_TAG}

      - echo "Creating image definitions"
      - printf '[{"name":"resume-craft-backend","imageUri":"%s"}]' "${IMAGE_REPO}:${IMAGE_TAG}" > imagedefinitions.json

      - echo "Preparing task definition template with the built ECR image"
      - sed -e "s|REPLACE_IMAGE_URI|${IMAGE_REPO}:${IMAGE_TAG}|g" taskdef.json > taskdef.rendered.json

      - echo "Backend build command placeholder, Build Phase Success!"

  # post_build:
  #   commands:
  #     - echo "Triggering ECS service deployment from the freshly pushed ECR image"
  #     - aws ecs update-service --cluster resume-craft-cluster --service resume-craft-backend --force-new-deployment --region ap-south-1

artifacts:
  files:
    - imagedefinitions.json
    - target/*.jar

cache:
  paths:
    - '/root/.m2/**/*'
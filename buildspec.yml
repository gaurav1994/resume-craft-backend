version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 20
    commands:
      - echo "Installing Maven wrapper dependencies"
      - chmod +x ./mvnw

  pre_build:
    commands:
      - echo "Login to ECR"
      - aws --version
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo "Building backend jar"
      - ./mvnw clean package -DskipTests

      - echo "Building backend docker image"
      - docker build -t resume-craft-backend .
      - docker tag resume-craft-backend:latest ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/resume-craft-backend:latest
      - docker push ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/resume-craft-backend:latest

      - echo "Creating image definitions"
      - printf '[{"name":"resume-craft-backend","imageUri":"%s"}]' "${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/resume-craft-backend:latest" > imagedefinitions.json

      - echo "Backend build command placeholder, Build Phase Success!"

  # post_build:
  #   commands:
  #     - echo "Triggering ECS service deployment from the freshly pushed ECR image"
  #     - aws ecs update-service --cluster resume-craft-cluster --service resume-craft-backend --force-new-deployment --region ap-south-1

artifacts:
  files:
    - imagedefinitions.json
    - target/*.jar

spring.application.name=resume-craft-backend

# Production profile uses a persistent database; change URL/user/password for real environment
spring.datasource.url=jdbc:h2:file:./data/resumecraft_prod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

spring.h2.console.enabled=false
server.port=9090

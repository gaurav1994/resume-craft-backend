spring.application.name=resume-craft-backend

# Default environment profile
spring.profiles.active=dev

# Shared service defaults
spring.jpa.open-in-view=false

# Dev profile properties are in application-dev.properties
# Prod profile properties are in application-prod.properties
# Run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod

# Frontend CORS origins can be overridden via environment or profile-specific files.
app.cors.allowed-origins=http://localhost:5173

spring.application.name=resume-craft-backend

# Development profile uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:resumecraft_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root911911

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
app.cors.allowed-origins=http://localhost:5173
